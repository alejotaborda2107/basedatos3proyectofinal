# Configuración base de ejemplo para un nodo del replica set (sin contraseñas)
# Ajustá el puerto (27017, 27018, 27019) y las rutas según cada nodo local

storage:
  dbPath: ./data/nodo1

systemLog:
  destination: file
  logAppend: true
  path: ./logs/nodo1.log

net:
  port: 27017
  bindIp: 127.0.0.1

replication:
  replSetName: "rsTiendaTech" # Cambiá por el nombre que usaste en tu replica set

security:
  authorization: enabled
  keyFile: ./secrets/mongodb-keyfile # Ruta de ejemplo; NO subir el archivo real al repo